name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare exact branding assets
        run: |
          set -e
          mkdir -p public/branding /tmp/branding
          cp branding/icon.jpg public/branding/icon.jpg
          cat branding/splash.b64.* | tr -d '\r\n' | base64 -d > public/branding/splash.jpg
          cp public/branding/splash.jpg /tmp/branding/splash.jpg
          cp branding/icon.jpg /tmp/branding/icon.jpg
          test -s /tmp/branding/icon.jpg
          test -s /tmp/branding/splash.jpg

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate Android icon and splash assets
        run: |
          set -e

          # Android 8+ préfère sinon l'ancienne icône adaptative créée par défaut.
          # On la retire pour forcer l'utilisation de l'image fournie par l'utilisateur.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          for spec in \
            "mipmap-mdpi 48" \
            "mipmap-hdpi 72" \
            "mipmap-xhdpi 96" \
            "mipmap-xxhdpi 144" \
            "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/icon.jpg -resize "${size}x${size}" -background white -gravity center -extent "${size}x${size}" "android/app/src/main/res/$dir/ic_launcher.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done

          for spec in \
            "drawable-port-mdpi 320x568" \
            "drawable-port-hdpi 480x854" \
            "drawable-port-xhdpi 720x1280" \
            "drawable-port-xxhdpi 1080x1920" \
            "drawable-port-xxxhdpi 1440x2560"; do
            set -- $spec
            dir="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/splash.jpg -resize "$size" -background '#07184a' -gravity center -extent "$size" "android/app/src/main/res/$dir/splash.png"
          done

          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-port-xxhdpi/splash.png android/app/src/main/res/drawable/splash.png

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Histoires-Comptines-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
