name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare launch branding
        run: |
          set -e
          mkdir -p public/branding
          cp branding/icon.jpg public/branding/icon.jpg
          cp branding/splash.svg public/branding/splash.svg
          test -s public/branding/icon.jpg
          test -s public/branding/splash.svg

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Generate Android icon and splash assets
        run: |
          set -e
          mkdir -p /tmp/branding
          rsvg-convert branding/splash.svg -w 1080 -h 1920 -o /tmp/branding/splash.png

          # L'icône source est déjà le visuel carré exact fourni.
          # ImageMagick tolère le flux JPEG et évite le plantage Pillow des builds précédents.
          convert branding/icon.jpg -auto-orient -strip /tmp/branding/icon-clean.png
          test -s /tmp/branding/icon-clean.png

          for spec in \
            "mipmap-mdpi 48" \
            "mipmap-hdpi 72" \
            "mipmap-xhdpi 96" \
            "mipmap-xxhdpi 144" \
            "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/icon-clean.png \
              -resize "${size}x${size}" \
              -background '#2B176D' \
              -gravity center \
              -extent "${size}x${size}" \
              "android/app/src/main/res/$dir/ic_launcher.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done

          # Icône adaptative Android : le dessin complet est placé dans la zone sûre.
          for spec in \
            "mipmap-mdpi 108 72" \
            "mipmap-hdpi 162 108" \
            "mipmap-xhdpi 216 144" \
            "mipmap-xxhdpi 324 216" \
            "mipmap-xxxhdpi 432 288"; do
            set -- $spec
            dir="$1"
            canvas="$2"
            art="$3"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/icon-clean.png \
              -resize "${art}x${art}" \
              -background '#2B176D' \
              -gravity center \
              -extent "${canvas}x${canvas}" \
              "android/app/src/main/res/$dir/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#2B176D</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          for spec in \
            "drawable-port-mdpi 320x568" \
            "drawable-port-hdpi 480x854" \
            "drawable-port-xhdpi 720x1280" \
            "drawable-port-xxhdpi 1080x1920" \
            "drawable-port-xxxhdpi 1440x2560"; do
            set -- $spec
            dir="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/splash.png -resize "${size}^" -gravity center -extent "$size" "android/app/src/main/res/$dir/splash.png"
          done

          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-port-xxhdpi/splash.png android/app/src/main/res/drawable/splash.png

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Histoires-Comptines-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
