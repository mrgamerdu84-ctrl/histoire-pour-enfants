name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare launch branding
        run: |
          set -e
          mkdir -p public/branding
          cp branding/icon.jpg public/branding/icon.jpg
          cp branding/splash.svg public/branding/splash.svg
          test -s public/branding/icon.jpg
          test -s public/branding/splash.svg

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick python3-pil

      - name: Generate Android icon and splash assets
        run: |
          set -e
          mkdir -p /tmp/branding
          rsvg-convert branding/splash.svg -w 1080 -h 1920 -o /tmp/branding/splash.png

          # Nettoie l'image source sans redessiner le visuel :
          # on garde uniquement le plus grand bloc non-blanc (l'icône elle-même),
          # puis on rend transparentes les marges blanches extérieures.
          python3 <<'PY'
          from PIL import Image
          from collections import deque

          src = Image.open('branding/icon.jpg').convert('RGB')
          w, h = src.size
          px = src.load()

          def non_white(x, y):
              r, g, b = px[x, y]
              return min(r, g, b) < 235 or (max(r, g, b) - min(r, g, b)) > 18

          seen = bytearray(w * h)
          best = None
          best_count = 0

          for y in range(h):
              for x in range(w):
                  idx = y * w + x
                  if seen[idx] or not non_white(x, y):
                      continue
                  q = deque([(x, y)])
                  seen[idx] = 1
                  count = 0
                  minx = maxx = x
                  miny = maxy = y
                  while q:
                      cx, cy = q.popleft()
                      count += 1
                      minx = min(minx, cx); maxx = max(maxx, cx)
                      miny = min(miny, cy); maxy = max(maxy, cy)
                      for nx, ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                          if nx < 0 or ny < 0 or nx >= w or ny >= h:
                              continue
                          nidx = ny * w + nx
                          if seen[nidx] or not non_white(nx, ny):
                              continue
                          seen[nidx] = 1
                          q.append((nx, ny))
                  if count > best_count:
                      best_count = count
                      best = (minx, miny, maxx + 1, maxy + 1)

          if not best or best_count < 1000:
              raise RuntimeError('Impossible de détecter le visuel principal de l’icône')

          left, top, right, bottom = best
          margin = 3
          left = max(0, left - margin); top = max(0, top - margin)
          right = min(w, right + margin); bottom = min(h, bottom + margin)
          icon = src.crop((left, top, right, bottom)).convert('RGBA')

          # Met au carré sans déformer.
          side = max(icon.width, icon.height)
          square = Image.new('RGBA', (side, side), (255,255,255,0))
          ox = (side - icon.width) // 2
          oy = (side - icon.height) // 2
          square.alpha_composite(icon, (ox, oy))

          # Les zones presque blanches reliées aux bords deviennent transparentes.
          rgba = square.load()
          sw, sh = square.size
          visited = bytearray(sw * sh)
          q = deque()
          for x in range(sw):
              q.append((x,0)); q.append((x,sh-1))
          for y in range(sh):
              q.append((0,y)); q.append((sw-1,y))

          def edge_white(x, y):
              r,g,b,a = rgba[x,y]
              return a > 0 and r > 238 and g > 238 and b > 238 and max(r,g,b)-min(r,g,b) < 14

          while q:
              x,y = q.popleft()
              idx = y * sw + x
              if visited[idx]:
                  continue
              visited[idx] = 1
              if not edge_white(x,y):
                  continue
              r,g,b,a = rgba[x,y]
              rgba[x,y] = (r,g,b,0)
              for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0 <= nx < sw and 0 <= ny < sh:
                      q.append((nx,ny))

          square.save('/tmp/branding/icon-clean.png')
          print('Icône détectée :', best, '=>', square.size)
          PY

          test -s /tmp/branding/icon-clean.png

          # Icônes classiques : carré propre, sans texte parasite ni déformation.
          for spec in \
            "mipmap-mdpi 48" \
            "mipmap-hdpi 72" \
            "mipmap-xhdpi 96" \
            "mipmap-xxhdpi 144" \
            "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/icon-clean.png \
              -resize "${size}x${size}" \
              -gravity center \
              -extent "${size}x${size}" \
              "android/app/src/main/res/$dir/ic_launcher.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done

          # Android 8+ : icône adaptative avec une zone de sécurité correcte.
          for spec in \
            "mipmap-mdpi 108 76" \
            "mipmap-hdpi 162 114" \
            "mipmap-xhdpi 216 152" \
            "mipmap-xxhdpi 324 228" \
            "mipmap-xxxhdpi 432 304"; do
            set -- $spec
            dir="$1"
            canvas="$2"
            art="$3"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/icon-clean.png \
              -resize "${art}x${art}" \
              -background none \
              -gravity center \
              -extent "${canvas}x${canvas}" \
              "android/app/src/main/res/$dir/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#2B176D</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          for spec in \
            "drawable-port-mdpi 320x568" \
            "drawable-port-hdpi 480x854" \
            "drawable-port-xhdpi 720x1280" \
            "drawable-port-xxhdpi 1080x1920" \
            "drawable-port-xxxhdpi 1440x2560"; do
            set -- $spec
            dir="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/$dir"
            convert /tmp/branding/splash.png -resize "${size}^" -gravity center -extent "$size" "android/app/src/main/res/$dir/splash.png"
          done

          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-port-xxhdpi/splash.png android/app/src/main/res/drawable/splash.png

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Histoires-Comptines-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
